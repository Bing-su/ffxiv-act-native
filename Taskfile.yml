# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    deps: [test]

  test:
    deps: [fixture, shim, ui-test]
    cmds:
      - cargo test

  ui-test:
    cmds:
      - dotnet build managed/UiBridgeCheck.cs --output target/managed/ui-test
      - '"target\\managed\\ui-test\\UiBridgeCheck.exe"'

  fixture:
    cmds:
      - dotnet build managed/fixtures/Act.cs --output managed/fixtures
      - dotnet build managed/fixtures/Common.cs --output managed/fixtures

  shim:
    cmds:
      - dotnet build managed/Shim.cs --output managed

  example:ffxiv-plugin:
    cmds:
      - cargo build --release --manifest-path examples/ffxiv-plugin/Cargo.toml
