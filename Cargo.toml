[package]
name = "ffxiv-act-native"
version = "0.1.0"
edition = "2024"
description = "FFXIV ACT native plugin in Rust"
license = "BlueOak-1.0.0"

[workspace]
members = ["examples/*"]

[dependencies]
bitflags = "2"
bytes = "1"
dotscope = { version = "0.9", default-features = false }
editpe = { version = "0.2", default-features = false }
sha1 = "0.11"
thiserror = "2"

[features]
embedded-contracts = []

[profile.release]
strip = true
lto = true
